<!-- index.html -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum JavaScript</title>
</head>
<body>
    <h1>Pengenalan JavaScript</h1>
    <p id="pesan">Konten awal.</p>

<h3>Cek Bilangan Genap atau Ganjil</h3>
<label for="bilangan">Masukkan bilangan bulat:</label>
<input type="number" id="bilangan" step="1">
<button type="button" onclick="cekBilangan()">Periksa</button>
<p id="hasilBilangan"></p>


<h3> Mengubah Warna Halaman</h3>

<button type="button" onclick="ubahWarnaLatar('lightgreen')">
    Latar Hijau
</button>

<button type="button" onclick="ubahWarnaLatar('white')">
    Latar Putih
</button>

<button type="button" onclick="ubahWarnaLatar('lightyellow')">
    Latar Kuning
</button>

<h3> Daftar Menu Makanan</h3>

<label>
    <input type="checkbox" class="menu" value="5000">
    Ayam Goreng - Rp5.000
</label>
<br>

<label>
    <input type="checkbox" class="menu" value="500">
    Tempe - Rp500
</label>
<br>

<label>
    <input type="checkbox" class="menu" value="2500">
    Telur Dadar - Rp2.500
</label>
<br>

<p>Total: Rp<span id="total">0</span></p>


<h2>Mini Project: Kalkulator Nilai Mahasiswa</h2>

<label>Nilai Tugas (30%):</label>
<input type="number" id="tugas" min="0" max="100">
<br><br>

<label>Nilai UTS (30%):</label>
<input type="number" id="uts" min="0" max="100">
<br><br>

<label>Nilai UAS (40%):</label>
<input type="number" id="uas" min="0" max="100">
<br><br>

<button type="button" onclick="hitungNilai()">Hitung Nilai</button>

<p id="hasilNilai"></p>

<script src="script.js"></script>
</body>
</html>
